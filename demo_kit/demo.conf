# demo.conf — every path and argument the demo uses lives here.
# Edit this file (not the scripts) if a binary name or argument order differs.
#
# Paths: by default everything is relative to the repository that contains this
# kit (a fresh clone works after `make legacy w04`). To use another checkout or
# build, set PROJECT before running, e.g.  PROJECT=/path/to/checkout ./demo.sh race
# Tools: NCU, NCU_UI, VTUNE, VTUNE_GUI can be set the same way.

KIT_DIR="${KIT:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
PROJECT="${PROJECT:-$(cd "$KIT_DIR/.." && pwd)}"
BUILD="${BUILD:-$PROJECT/build}"

# --- Profilers ---------------------------------------------------------------
# Nsight Compute: $NCU if set, else the standalone 2026.3 install, else the newest
# /opt/nvidia/nsight-compute/*/ncu, else ncu on PATH.
_ncu_default() {
  local c; for c in /opt/nvidia/nsight-compute/2026.3.0/ncu $(ls -d /opt/nvidia/nsight-compute/*/ncu 2>/dev/null | sort -V -r); do
    [[ -x "$c" ]] && { echo "$c"; return; }; done
  command -v ncu || echo ncu
}
NCU="${NCU:-$(_ncu_default)}"
NCU_UI="${NCU_UI:-$( [[ -x "$(dirname "$NCU")/ncu-ui" ]] && echo "$(dirname "$NCU")/ncu-ui" || command -v ncu-ui || echo ncu-ui )}"
VTUNE="${VTUNE:-$(command -v vtune || echo vtune)}"
VTUNE_GUI="${VTUNE_GUI:-$(command -v vtune-gui || echo vtune-gui)}"
# ncu needs GPU performance counters, which need root unless the driver option
# NVreg_RestrictProfilingOnlyToAdminUsers=0 is set. Set NCU_SUDO="" in that case.
NCU_SUDO="${NCU_SUDO-sudo}"
# Which kernel launch to profile. Default = the first launch (-c 1).
# If preflight shows the wrong kernel name (e.g. an init/convert kernel),
# set a name filter, e.g. NCU_KFILTER="regex:wmma|gemm"
NCU_KFILTER=""
# SpeedOfLight_RooflineChart adds Nsight's own roofline chart; WarpStateStats gives stall reasons;
# ComputeWorkloadAnalysis gives per-pipe (FMA / Tensor) utilisation; SourceCounters fills the Source page.
NCU_SECTIONS="--section SpeedOfLight --section SpeedOfLight_RooflineChart --section ComputeWorkloadAnalysis --section MemoryWorkloadAnalysis --section Occupancy --section LaunchStats --section WarpStateStats --section SourceCounters"
NCU_METRICS="sm__pipe_tensor_op_hmma_cycles_active.avg.pct_of_peak_sustained_active,sm__inst_executed_pipe_tensor_op_hmma.sum"

# --- GPU binaries (W01-W03, in $PROJECT/build) --------------------------------
W01_GPU_S1="$BUILD/W01_VECTOR_ADD_GPU_S1_BASE_NAIVE"
W01_GPU_S2="$BUILD/W01_VECTOR_ADD_GPU_S2_SWOPT_COALESCED"
W02_GPU_S1="$BUILD/W02_DOT_PRODUCT_GPU_S1_BASE_NAIVE"
W02_GPU_S2="$BUILD/W02_DOT_PRODUCT_GPU_S2_SWOPT_BLOCK_REDUCE"
W03_GPU_S1="$BUILD/W03_GEMM_GPU_S1_BASE_NAIVE"
W03_GPU_S2="$BUILD/W03_GEMM_GPU_S2_SWOPT_SHARED_TILE"
W03_GPU_S3="$BUILD/W03_GEMM_GPU_S3_HWACC_TENSOR_CORE"

# --- CPU binaries (W03, for the VTune cues) -----------------------------------
W03_CPU_S1="$BUILD/W03_GEMM_CPU_S1_BASE"
W03_CPU_S2="$BUILD/W03_GEMM_CPU_S2_SWOPT_CACHE_BLOCK"
W03_CPU_S3="$BUILD/W03_GEMM_CPU_S3_HWACC_AVX2_FMA"

# --- W04 Attention -----------------------------------------------------------
W04_PROJECT="$PROJECT"
W04_BUILD="$BUILD"
W04_GPU_S1="$W04_BUILD/W04_ATTENTION_GPU_S1_BASE_NAIVE"
W04_GPU_S2a="$W04_BUILD/W04_ATTENTION_GPU_S2a_SWOPT_UNFUSED"
W04_GPU_S2b="$W04_BUILD/W04_ATTENTION_GPU_S2b_SWOPT_FUSED"
W04_GPU_S3_FP16="$W04_BUILD/W04_ATTENTION_GPU_S3_HWACC_TENSOR_CORE_FP16"
W04_GPU_S3_TF32="$W04_BUILD/W04_ATTENTION_GPU_S3_HWACC_TENSOR_CORE_TF32"
W04_GPU_REF="$W04_BUILD/W04_ATTENTION_GPU_REF_CUBLAS"     # vendor reference, not a stage
W04_CPU_S1="$W04_BUILD/W04_ATTENTION_CPU_S1_BASE"
W04_CPU_S2="$W04_BUILD/W04_ATTENTION_CPU_S2_SWOPT_BLOCKED_OMP"
W04_CPU_S3="$W04_BUILD/W04_ATTENTION_CPU_S3_HWACC_AVX2"
# Shape and protocol. GPU stages use their tuned defaults (src/common/w04_tuned.hpp).
W04_N=2048
W04_SHAPE="--bh 8 --d 64"
W04_ARGS="--iters 20 --reps 5 --warmup 2"          # project protocol
# CPU at the same N, so CPU vs GPU is a fair comparison. CPU S1 takes ~1.2 s per pass
# at N=2048, so it alone runs 1 iteration x 3 repetitions (+1 warm-up), ~7 s.
W04_CPU_N="$W04_N"
W04_CPU_S1_ARGS="--iters 1 --reps 3 --warmup 1"
W04_CPU_ARGS="--iters 20 --reps 5 --warmup 2"
W04_CPU_THREADS=""      # empty = OpenMP default (20 threads); OMP_PROC_BIND=close OMP_PLACES=cores always

# --- Race selection and rounds -------------------------------------------------
# ./demo.sh race [all|gpu|w01|w02|w03|w04|w04cpu ...]
RACE_ALL="w01 w02 w03 w04 w04cpu"
RACE_GPU="w01 w02 w03 w04"
# ROUNDS=3 ./demo.sh race w04 : interleaved rounds, median over rounds (the project's GPU protocol)
ROUNDS="${ROUNDS:-1}"

# --- Fusion cue (./demo.sh fusion): live ncu DRAM bytes, S2a vs S2b ----------
FUSION_N=2048
FUSION_METRICS="dram__bytes_read.sum,dram__bytes_write.sum,lts__t_bytes.sum,gpu__time_duration.sum,dram__throughput.avg.pct_of_peak_sustained_elapsed"
FUSION_TILE16="${FUSION_TILE16:-0}"   # 1 = also profile S2b 16x16 W8 (same per-thread work as S2a)
# Recorded ncu run (E3, 2026-11-06), used by --backup and when a live run fails:
# profiling/ in the full repository, or the copy in "Comparison final/" in a clone.
FUSION_BACKUP="$PROJECT/profiling/W04_ATTENTION/e3/20261106-103802"
[[ -d "$FUSION_BACKUP" ]] || FUSION_BACKUP="$PROJECT/Comparison final/runs/profiling/20261106-103802_E3_dram_bytes"

# --- Sizes for the live run --------------------------------------------------
VEC_N=33554432          # W01/W02 elements (same as formal runs)
GEMM_N=1024             # GPU GEMM size (same as formal runs)
# CPU naive GEMM is ~3 s per iteration at 1024 (-O0). For a live VTune run keep
# it short: N=768, 1 iteration, 1 repetition, 1 warm-up ≈ 3 s of sampling.
CPU_GEMM_N=768
CPU_GEMM_ARGS="1 1 1"   # iterations repetitions warmup
CPU_THREADS=8           # W03 CPU threads, as in the final re-test
# The optimised S3 finishes one N=768 GEMM in ~10 ms: too short for VTune to sample.
# Same N as S1 (fair comparison), but 200 iterations so it runs ~2 s.
CPU_GEMM_S3_N=768
CPU_GEMM_S3_ARGS="200 1 1"

# Arguments for profiling runs (keep the kernel count small)
PROFILE_ARGS="1 1 1"    # iterations repetitions warmup

# --- Output: every live run gets a fresh timestamped folder ------------------
STAMP="$(date +%Y%m%d_%H%M%S)"
LIVE="$PROJECT/results/live/$STAMP"
DEMO_REPORTS="$PROJECT/profiling/demo"   # pre-captured backups live here
VIDEO="${VIDEO:-$PROJECT/demo/benchmark_race.mp4}"   # optional race animation (not in the repository)
